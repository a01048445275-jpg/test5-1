<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 주문서</title>
  <style>
    /* 전체 기본 설정 및 카페 테마 색상 (베이지 & 브라운) 적용 */
    * {
      box-sizing: border-box;
      font-family: '맑은 고딕', 'Malgun Gothic', sans-serif;
    }

    body {
      background-color: #faf6f0;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    /* 카드 컨테이너 (최대 너비 520px, 가운데 정렬, 둥근 모서리와 그림자) */
    .container {
      width: 100%;
      max-width: 520px;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(107, 66, 38, 0.08);
    }

    /* 페이지 상단 헤더 스타일 */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header .logo {
      font-size: 50px;
      margin-bottom: 5px;
    }

    .header h1 {
      font-size: 24px;
      color: #6b4226;
      margin: 0 0 5px 0;
    }

    .header p {
      font-size: 14px;
      color: #8c7362;
      margin: 0;
    }

    /* 폼 요소 공통 스타일 */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label.main-label {
      display: block;
      font-weight: bold;
      color: #6b4226;
      margin-bottom: 6px;
      font-size: 14px;
    }

    /* 입력칸 기본 스타일 (100% 너비, 패딩, 둥근 모서리) */
    input[type="text"],
    input[type="tel"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    /* 입력칸 포커스 스타일 (갈색 테마 적용) */
    input[type="text"]:focus,
    input[type="tel"]:focus,
    input[type="number"]:focus,
    select:focus,
    textarea:focus {
      border-color: #6b4226;
      box-shadow: 0 0 6px rgba(107, 66, 38, 0.25);
    }

    /* 라디오/체크박스 가로 배치 스타일 */
    .option-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .option-group label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      cursor: pointer;
    }

    /* 예상 금액 영역 (24px, 갈색, 굵게, 가운데 정렬) */
    .price-display {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #6b4226;
      margin: 25px 0 15px 0;
    }

    /* 버튼 그룹 스타일 */
    .button-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    /* 주문하기 버튼 */
    .btn-submit {
      background-color: #6b4226;
      color: #ffffff;
    }

    .btn-submit:hover {
      background-color: #825231;
    }

    /* 다시 작성 버튼 */
    .btn-reset {
      background-color: #e0d8d0;
      color: #4a382c;
    }

    .btn-reset:hover {
      background-color: #d1c5b8;
    }

    /* 주문 확인 메시지 스타일 (연두색 배경, 초록 글씨, 둥근 모서리) */
    .order-summary {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background-color: #e8f5e9;
      color: #2e7d32;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      border: 1px solid #c8e6c9;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 페이지 상단 로고 및 카페 이름 -->
    <div class="header">
      <div class="logo">☕</div>
      <h1>바이브 카페</h1>
      <p>당신의 하루에 바이브를 더하다</p>
    </div>

    <!-- 주문서 폼 -->
    <form id="orderForm">
      <!-- 1. 이름 -->
      <div class="form-group">
        <label for="customerName" class="main-label">1. 이름 (필수)</label>
        <input type="text" id="customerName" placeholder="성함을 입력해주세요" required>
      </div>

      <!-- 2. 전화번호 -->
      <div class="form-group">
        <label for="phoneNumber" class="main-label">2. 전화번호</label>
        <input type="tel" id="phoneNumber" placeholder="010-0000-0000">
      </div>

      <!-- 3. 음료 선택 -->
      <div class="form-group">
        <label for="beverage" class="main-label">3. 음료 선택</label>
        <select id="beverage">
          <option value="" data-price="0">-- 음료를 선택해주세요 --</option>
          <option value="아메리카노" data-price="3500">아메리카노 (3,500원)</option>
          <option value="카페라떼" data-price="4000">카페라떼 (4,000원)</option>
          <option value="카페모카" data-price="4500">카페모카 (4,500원)</option>
          <option value="바닐라라떼" data-price="4500">바닐라라떼 (4,500원)</option>
          <option value="녹차라떼" data-price="4500">녹차라떼 (4,500원)</option>
        </select>
      </div>

      <!-- 4. 사이즈 -->
      <div class="form-group">
        <label class="main-label">4. 사이즈</label>
        <div class="option-group">
          <label for="sizeS">
            <input type="radio" id="sizeS" name="size" value="S" data-price="0"> S (+0원)
          </label>
          <label for="sizeM">
            <input type="radio" id="sizeM" name="size" value="M" data-price="500" checked> M (+500원)
          </label>
          <label for="sizeL">
            <input type="radio" id="sizeL" name="size" value="L" data-price="1000"> L (+1,000원)
          </label>
        </div>
      </div>

      <!-- 5. 추가 옵션 -->
      <div class="form-group">
        <label class="main-label">5. 추가 옵션</label>
        <div class="option-group">
          <label for="optShot">
            <input type="checkbox" id="optShot" class="opt-check" value="샷 추가" data-price="500"> 샷 추가 (+500원)
          </label>
          <label for="optCream">
            <input type="checkbox" id="optCream" class="opt-check" value="크림 추가" data-price="500"> 크림 추가 (+500원)
          </label>
          <label for="optSyrup">
            <input type="checkbox" id="optSyrup" class="opt-check" value="시럽 추가" data-price="300"> 시럽 추가 (+300원)
          </label>
          <label for="optDecaf">
            <input type="checkbox" id="optDecaf" class="opt-check" value="디카페인" data-price="0"> 디카페인 (+0원)
          </label>
        </div>
      </div>

      <!-- 6. 수량 -->
      <div class="form-group">
        <label for="quantity" class="main-label">6. 수량</label>
        <input type="number" id="quantity" value="1" min="1" max="10">
      </div>

      <!-- 7. 요청사항 -->
      <div class="form-group">
        <label for="specialRequests" class="main-label">7. 요청사항</label>
        <textarea id="specialRequests" rows="3" placeholder="기타 요청사항을 입력해주세요."></textarea>
      </div>

      <!-- 예상 금액 표시 영역 -->
      <div class="price-display">
        예상 금액: <span id="totalPrice">0</span>원
      </div>

      <!-- 버튼 영역 -->
      <div class="button-group">
        <button type="button" id="btnSubmit" class="btn btn-submit">주문하기</button>
        <button type="button" id="btnReset" class="btn btn-reset">다시 작성</button>
      </div>
    </form>

    <!-- 주문 확인 메시지 영역 -->
    <div id="orderSummary" class="order-summary"></div>
  </div>

  <script>
    // DOM 요소 가져오기
    const beverageSelect = document.getElementById('beverage');
    const sizeRadios = document.querySelectorAll('input[name="size"]');
    const optionCheckboxes = document.querySelectorAll('.opt-check');
    const quantityInput = document.getElementById('quantity');
    const totalPriceSpan = document.getElementById('totalPrice');
    
    const customerNameInput = document.getElementById('customerName');
    const orderForm = document.getElementById('orderForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnReset = document.getElementById('btnReset');
    const orderSummary = document.getElementById('orderSummary');

    // 실시간 총 금액 계산 함수
    function calculateTotal() {
      // 1. 선택된 음료 기본 가격
      const selectedOption = beverageSelect.options[beverageSelect.selectedIndex];
      const beveragePrice = parseInt(selectedOption.getAttribute('data-price')) || 0;

      // 2. 선택된 사이즈 추가 금액
      let sizePrice = 0;
      sizeRadios.forEach(radio => {
        if (radio.checked) {
          sizePrice = parseInt(radio.getAttribute('data-price')) || 0;
        }
      });

      // 3. 선택된 옵션 추가 금액
      let optionsPrice = 0;
      optionCheckboxes.forEach(checkbox => {
        if (checkbox.checked) {
          optionsPrice += parseInt(checkbox.getAttribute('data-price')) || 0;
        }
      });

      // 4. 수량
      let quantity = parseInt(quantityInput.value) || 1;
      if (quantity < 1) quantity = 1;
      if (quantity > 10) quantity = 10;

      // 5. 총 금액 계산 ( (음료가격 + 사이즈 + 옵션) * 수량 )
      const singleItemPrice = beveragePrice + sizePrice + optionsPrice;
      const total = singleItemPrice * quantity;

      // 천 단위 콤마 적용 후 화면에 표시
      totalPriceSpan.textContent = total.toLocaleString('ko-KR');
      return total;
    }

    // 입력 요소 변경 시 금액 재계산 이벤트 리스너 등록
    beverageSelect.addEventListener('change', calculateTotal);
    sizeRadios.forEach(radio => radio.addEventListener('change', calculateTotal));
    optionCheckboxes.forEach(checkbox => checkbox.addEventListener('change', calculateTotal));
    quantityInput.addEventListener('input', calculateTotal);

    // 주문하기 버튼 클릭 시 유효성 검사 및 결과 메시지 출력
    btnSubmit.addEventListener('click', () => {
      const name = customerNameInput.value.trim();
      const beverage = beverageSelect.value;

      // 1. 이름 입력 유효성 검사
      if (!name) {
        alert('이름을 입력해주세요');
        customerNameInput.focus();
        return;
      }

      // 2. 음료 선택 유효성 검사
      if (!beverage) {
        alert('음료를 선택해주세요');
        beverageSelect.focus();
        return;
      }

      // 선택된 사이즈 가져오기
      let selectedSize = '';
      sizeRadios.forEach(radio => {
        if (radio.checked) selectedSize = radio.value;
      });

      // 선택된 추가 옵션 배열에 담기
      const selectedOptions = [];
      optionCheckboxes.forEach(checkbox => {
        if (checkbox.checked) {
          selectedOptions.push(checkbox.value);
        }
      });

      // 옵션 문구 포맷팅 (예: " (샷 추가, 크림 추가)")
      const optionsText = selectedOptions.length > 0 ? ` (${selectedOptions.join(', ')})` : '';
      const quantity = quantityInput.value;
      const finalPrice = calculateTotal().toLocaleString('ko-KR');

      // 주문 확인 메시지 생성 및 표시
      const resultMessage = `${name}님, ${beverage} ${selectedSize}사이즈${optionsText} ${quantity}잔, 총 ${finalPrice}원 주문이 접수되었습니다!`;
      
      orderSummary.textContent = resultMessage;
      orderSummary.style.display = 'block';
    });

    // 다시 작성 버튼 클릭 시 초기화
    btnReset.addEventListener('click', () => {
      // 폼 기본 요소 초기화
      orderForm.reset();
      // 주문 확인 메시지 숨김
      orderSummary.style.display = 'none';
      orderSummary.textContent = '';
      // 금액 재계산 (0원 표시)
      calculateTotal();
    });

    // 페이지 로드 시 초기 금액 계산 실행
    calculateTotal();
  </script>
</body>
</html>
